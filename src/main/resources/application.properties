# application.properties
app.name=Weekly Menu Planner
app.version=1.0
window.width=1200
window.height=800

ui.calendar.weight=2
ui.dishes.weight=1
ui.dish.columns=3
ui.dish.rows=5
ui.debug-borders=false

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:file:./data/weeklymenu;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
